<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DESIRE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>DESIRE — магазин</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: спокойный, дорогой, как Apple Store — много воздуха, крупные заголовки
   IDEA: витрина шоурума DESIRE в кармане — фото вещей ведут, интерфейс отступает
   PICTURE: живые фото из каталога в карточках с мягкими скруглениями
   COLOUR and TYPE: белый/#f5f5f7, графит #1d1d1f, тёплый беж каталога #efe8e1; Inter + Lora для марки
   LAYOUT: стеклянная панель вкладок снизу, листы-шторки для товара, корзины и оплаты */
:root{color-scheme:light dark;
--bg:light-dark(#f5f5f7,#000);--card:light-dark(#fff,#1c1c1e);--ink:light-dark(#1d1d1f,#f5f5f7);--muted:light-dark(#6e6e73,#98989d);
--line:light-dark(#e5e5ea,#2c2c2e);--fill:light-dark(#efeff4,#2c2c2e);--beige:light-dark(#efe8e1,#2a2622);--accent:light-dark(#0071e3,#2997ff);
--btn:light-dark(#1d1d1f,#f5f5f7);--btnInk:light-dark(#fff,#000);--red:#e30000;--green:light-dark(#1a8f3c,#30d158);--glass:light-dark(rgba(250,250,252,.78),rgba(28,28,30,.72));
--r:18px;--safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block;max-width:100%}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:10px}
.top{position:relative;z-index:20;padding:calc(10px + var(--safeT)) max(4vw,16px) 10px;display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.brand{font:600 22px/1 Lora,Georgia,serif;letter-spacing:.14em;color:var(--ink)}
.top .sp{flex:1}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;position:relative}
.icon:hover{background:var(--fill)}
.icon svg,.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1180px;margin:0 auto;padding:8px max(4vw,16px) calc(90px + var(--safeB))}
h1{font-size:clamp(30px,5vw,44px);line-height:1.05;letter-spacing:-.02em;margin:18px 0 14px;font-weight:700;text-wrap:balance}
h2{font-size:22px;letter-spacing:-.01em;margin:28px 0 12px;font-weight:700}
h3{font-size:17px;margin:0 0 6px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}
.hero{border-radius:28px;overflow:hidden;background:var(--beige);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:360px;position:relative}
.hero .tx{padding:clamp(22px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero .tx b{font:600 clamp(36px,6vw,64px)/1 Lora,serif;letter-spacing:.06em}
.hero .tx p{margin:0;font-size:17px;max-width:34ch}
.hero .ph{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
.hero .ph img{width:100%;height:100%;object-fit:cover;border-radius:22px;aspect-ratio:3/4}
.promo{margin-top:14px;border-radius:var(--r);padding:16px 18px;background:var(--btn);color:var(--btnInk);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.promo b{font-size:17px}.promo span{opacity:.75;flex:1 1 200px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--btn);color:var(--btnInk);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,220px),1fr));gap:14px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;position:relative;text-align:left;display:flex;flex-direction:column;transition:transform .25s}
.card:active{transform:scale(.98)}
.card>button:first-child{display:block;width:100%;text-align:left;color:inherit}
.card .im{aspect-ratio:3/4;background:var(--beige);overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .b{padding:10px 12px 14px;display:flex;flex-direction:column;gap:2px}
.card .n{font-weight:600;font-size:15px}
.card .c{font-size:13px;color:var(--muted)}
.price{font-weight:600;white-space:nowrap}.old{color:var(--muted);text-decoration:line-through;font-weight:400;margin-left:6px;font-size:.88em}
.sale{color:var(--red)}
.badge{position:absolute;top:10px;left:10px;background:var(--card);color:var(--ink);font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px}
.badge.r{background:var(--red);color:#fff}
.fav{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(8px)}
.fav svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.8}
.fav.on svg{fill:var(--red);stroke:var(--red)}
.dots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:4px max(env(safe-area-inset-left,0px),6px) calc(4px + var(--safeB)) max(env(safe-area-inset-right,0px),6px);background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.tab{flex:1;max-width:130px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);position:relative}
.tab.on{color:var(--ink);font-weight:600}.tab.on svg{stroke-width:2.1}
.cnt{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.btn{height:50px;padding:0 22px;border-radius:14px;background:var(--btn);color:var(--btnInk);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.w{width:100%}.btn.sec{background:var(--fill);color:var(--ink)}.btn.blue{background:var(--accent);color:#fff}.btn.red{background:transparent;color:var(--red)}
.btn.sm{height:38px;padding:0 14px;border-radius:11px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;opacity:0;transition:opacity .3s;display:flex;align-items:flex-end;justify-content:center}
.sheetbg.show{opacity:1}
.sheet{background:var(--bg);width:min(760px,100%);max-height:94vh;border-radius:26px 26px 0 0;overflow-y:auto;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding:0 0 calc(24px + var(--safeB))}
.sheetbg.show .sheet{transform:none}
@media(min-width:800px){.sheetbg{align-items:center}.sheet{border-radius:26px;max-height:90vh}}
.sh-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:12px 12px 10px 20px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.sh-h b{flex:1;font-size:17px}
.sh-b{padding:4px 20px 0}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;padding:0 20px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:min(78%,380px);aspect-ratio:3/4;object-fit:cover;border-radius:20px;scroll-snap-align:center;background:var(--beige)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.swb{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 8px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:14px}
.swb.on{border-color:var(--ink)}.swb:disabled{opacity:.4;text-decoration:line-through}
.swb[data-na]{opacity:.45;text-decoration:line-through;border-style:dashed}.swb[data-na].on{opacity:.8}
.cookie{position:fixed;left:10px;right:10px;bottom:calc(70px + var(--safeB));z-index:45;max-width:560px;margin:0 auto;padding:14px 16px;border-radius:18px;background:var(--card);border:.5px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.18);font-size:14px}
.cookie p{margin:0 0 10px}body.nf .cookie{bottom:calc(126px + var(--safeB))}
.policy h3{margin:16px 0 4px;font-size:15px}.policy p,.policy li{font-size:14px;line-height:1.45}
.bars{display:grid;gap:7px}.bar,.fn{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(50px,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bt{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bt i{display:block;height:100%;background:var(--ink);border-radius:9px}
.bv{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.bv em{font-style:normal;color:var(--muted);margin-left:4px}
.fn{padding:5px 0;grid-template-columns:1fr auto;row-gap:4px}.fn .bl{white-space:normal}.fn .bt{grid-column:1/-1;grid-row:2}.fn.warn .bt i{background:var(--red)}.fn.warn .bl{color:var(--red);font-weight:600}
.swb i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row .f{flex:1 1 45%}.row>.r{flex:1 1 55%;text-align:right}
.thumb{width:64px;height:84px;border-radius:12px;object-fit:cover;background:var(--beige);flex:none}
.qty{display:flex;align-items:center;background:var(--fill);border-radius:10px}
.qty button{width:36px;height:36px;font-size:20px}.qty span{min-width:22px;text-align:center;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.inp{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;width:100%}
textarea.inp{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:12px;padding:3px;gap:3px}
.seg.adm{grid-auto-columns:max-content;overflow-x:auto;scrollbar-width:none}.seg.adm button{padding:0 14px}
.seg button{height:42px;border-radius:9px;font-weight:600;font-size:15px}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sum{display:flex;justify-content:space-between;padding:6px 0;gap:10px}
.sum.t{font-size:20px;font-weight:700;border-top:.5px solid var(--line);margin-top:6px;padding-top:12px}
.sug{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:4px;max-height:220px;overflow-y:auto}
.sug button{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:.5px solid var(--line)}
.note{background:var(--beige);border-radius:14px;padding:12px 14px;font-size:14px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(14px + var(--safeT));transform:translate(-50%,calc(-100% - 40px - var(--safeT)));opacity:0;visibility:hidden;pointer-events:none;background:var(--btn);color:var(--btnInk);padding:12px 18px;border-radius:14px;z-index:90;font-weight:500;transition:transform .35s,opacity .35s,visibility 0s .35s;max-width:90vw}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .35s,opacity .2s}
.qrbox{background:#fff;border-radius:22px;padding:18px;width:min(300px,80vw);margin:8px auto}
.qrbox svg,.qrbox img{width:100%;height:auto}
.st{display:inline-block;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--fill);white-space:nowrap}
.st.awaiting{background:#fff3cd;color:#8a6100}.st.paid{background:#dff3ff;color:#0060a8}.st.assembling{background:#efe3ff;color:#6a2bb5}.st.shipped{background:#e2f6e7;color:#1a7a35}.st.done{background:#e7e7ea;color:#444}.st.cancelled{background:#ffe1e1;color:#b00}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:8px}
.kpi{background:var(--card);border-radius:var(--r);padding:14px 16px}.kpi b{display:block;font-size:26px;letter-spacing:-.02em}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:9px 10px;border-bottom:.5px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n{text-align:right;white-space:nowrap}
.stk{width:74px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);text-align:center;font-size:16px}
.low{color:var(--red);font-weight:600}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.phs div{position:relative}.phs img{aspect-ratio:3/4;object-fit:cover;border-radius:10px;width:100%}
.phs select{width:100%;font-size:12px;margin-top:4px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.phs .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:15px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch input{width:48px;height:28px;accent-color:var(--green)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.stack3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.box{background:var(--card);border-radius:var(--r);padding:16px}
@media(max-width:600px){.hero{grid-template-columns:1fr;min-height:0}.hero .ph{order:-1}.hero .ph img{aspect-ratio:4/5}.two{grid-template-columns:1fr}table{font-size:13px}}
/* На Netlify в правом нижнем углу плашка «Powered by Netlify» — поднимаем меню над ней */
body.nf .tabs{padding-bottom:calc(60px + var(--safeB))}body.nf main{padding-bottom:calc(150px + var(--safeB))}body.nf .sheet{padding-bottom:calc(84px + var(--safeB))}
/* О нас, отзывы, бонусы, опции */
.about{margin-top:28px;border-radius:28px;background:var(--beige);padding:clamp(22px,4vw,40px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
.about p{margin:0 0 8px;font-size:17px;max-width:52ch}
.ab-st{display:grid;gap:10px}.ab-st div{background:var(--card);border-radius:18px;padding:14px 16px}.ab-st b{display:block;font:600 26px/1.1 Lora,Georgia,serif}.ab-st span{font-size:14px;color:var(--muted)}
@media(max-width:700px){.about{grid-template-columns:1fr}}
.stars{display:inline-flex;gap:1px;vertical-align:-2px}.stars svg{width:var(--s);height:var(--s);fill:var(--line);stroke:none}.stars svg.on{fill:#f5a623}
.rt{color:var(--ink);white-space:nowrap}.rt i{font-style:normal;color:var(--muted)}
.rlink{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;min-height:32px}
.lnk{color:var(--accent);font-size:inherit;text-decoration:underline;text-underline-offset:2px}
.rev{padding:12px 0;border-bottom:.5px solid var(--line)}.rev p{margin:6px 0 0}.rh{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rph{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.rph img{width:72px;height:96px;object-fit:cover;border-radius:10px;display:block}
.rate{display:flex;gap:6px;margin:10px 0 14px}.rate button{width:46px;height:46px;border-radius:12px;background:var(--fill);display:grid;place-items:center}.rate svg{width:28px;height:28px;fill:var(--line)}.rate .on svg{fill:#f5a623}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;cursor:pointer}.opt input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--accent)}
.bonus{margin:6px 0 4px;border-radius:var(--r);padding:16px 18px;background:var(--btn);color:var(--btnInk)}.bonus>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.bonus b{font-size:28px;letter-spacing:-.02em}.bonus p{margin:6px 0 0;opacity:.75}
.ul{margin:6px 0;padding-left:20px}.ul li{margin:4px 0}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
/* Установка на телефон */
.inst{display:flex;align-items:center;gap:12px;margin:12px 0 4px;padding:12px 12px 12px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.inst img{width:44px;height:44px;border-radius:11px;flex:none}
.inst .f{flex:1}.inst b{display:block;font-size:15px}.inst span{font-size:13px;color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0 0}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:.5px solid var(--line)}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--btn);color:var(--btnInk);display:grid;place-items:center;font-weight:700;font-size:14px}
.kbd{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:30px;height:28px;padding:0 8px;border-radius:8px;background:var(--fill);font-weight:600;font-size:14px;vertical-align:middle}
.kbd svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="logo" aria-label="На главную">DESIRE</button>
  <span class="sp"></span>
  <button class="icon" id="chatBtn" aria-label="Написать нам"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/></svg></button>
  <button class="icon" id="searchBtn" aria-label="Поиск"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" role="status"></div>
<script src="qrcode.js"></script>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
